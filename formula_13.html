<!DOCTYPE html>

<head>

    <title>Advanced Mathematics Formulas - MOGIBARA</title>

</head>

<body>

  <header>
       <h2>(x+a)(x+b)(x+c)</h2>
  </header>

  <main>
     <section>
       <h3>MAIN ANSWER</h3>
        <p>(x+a)(x+b)(x+c)</p>
      <br>
        <p>=x<sup>3</sup>+(a+b+c)x<sup>2</sup>+(ab+bc+ca)x+abc</p>
     </section>

     <section>
       <h3>PROVE</h3>
        <p>(x+a)(x+b)</p>
      <br>
        <p>=x<sup>2</sup>+bx+ax+ab</p>
      <br>
        <p>=x<sup>2</sup>+(a+b)x+ab</p>
      <br>
        <p>Now multiply by (x+c):</p>
      <br>
        <p>(x<sup>2</sup>+(a+b)x+ab)(x+c)</p>
      <br>
        <p>=x<sup>3</sup>+(a+b)x<sup>2</sup>+abx+cx<sup>2</sup>+c(a+b)x+abc</p>
      <br>
        <p>=x<sup>3</sup>+(a+b+c)x<sup>2</sup>+(ab+bc+ca)x+abc</p>
      <br>
        <p>PROVED</p>
     </section>

  </main>

</body>
</html>
