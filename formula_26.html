  <header>
       <h2>a<sup>5</sup>+b<sup>5</sup></h2>
  </header>

  <main>
     <section>
       <h3>MAIN ANSWER</h3>
        <p>a<sup>5</sup>+b<sup>5</sup></p>
      <br>
        <p>=(a+b)(a<sup>4</sup>-a<sup>3</sup>b+a<sup>2</sup>b<sup>2</sup>-ab<sup>3</sup>+b<sup>4</sup>)</p>
     </section>

     <section>
       <h3>PROVE</h3>
        <p>(a+b)(a<sup>4</sup>-a<sup>3</sup>b+a<sup>2</sup>b<sup>2</sup>-ab<sup>3</sup>+b<sup>4</sup>)</p>
      <br>
        <p>=a(a<sup>4</sup>-a<sup>3</sup>b+a<sup>2</sup>b<sup>2</sup>-ab<sup>3</sup>+b<sup>4</sup>)+b(a<sup>4</sup>-a<sup>3</sup>b+a<sup>2</sup>b<sup>2</sup>-ab<sup>3</sup>+b<sup>4</sup>)</p>
      <br>
        <p>=a<sup>5</sup>-a<sup>4</sup>b+a<sup>3</sup>b<sup>2</sup>-a<sup>2</sup>b<sup>3</sup>+ab<sup>4</sup>+a<sup>4</sup>b-a<sup>3</sup>b<sup>2</sup>+a<sup>2</sup>b<sup>3</sup>-ab<sup>4</sup>+b<sup>5</sup></p>
      <br>
        <p>=a<sup>5</sup>+b<sup>5</sup></p>
      <br>
        <p>PROVED</p>
     </section>
