  <header>
       <h2>(a+b+c)<sup>2</sup></h2>
  </header>

  <main>
     <section>
       <h3>MAIN ANSWER</h3>
        <p>(a+b+c)<sup>2</sup></p>
      <br>
        <p>=a<sup>2</sup>+b<sup>2</sup>+c<sup>2</sup>+2ab+2bc+2ca</p>
     </section>

     <section>
       <h3>PROVE</h3>
        <p>(a+b+c)<sup>2</sup></p>
      <br>
        <p>=(a+b+c)(a+b+c)</p>
      <br>
        <p>=a(a+b+c)+b(a+b+c)+c(a+b+c)</p>
      <br>
        <p>=a<sup>2</sup>+ab+ac+ab+b<sup>2</sup>+bc+ac+bc+c<sup>2</sup></p>
      <br>
        <p>=a<sup>2</sup>+b<sup>2</sup>+c<sup>2</sup>+2ab+2bc+2ca</p>
      <br>
        <p>PROVED</p>
     </section>

  </main>
