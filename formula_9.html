<body>

  <header>
       <h2>a<sup>4</sup>+b<sup>4</sup></h2>
  </header>

  <main>
     <section>
       <h3>MAIN ANSWER</h3>
        <p>a<sup>4</sup>+b<sup>4</sup></p>
      <br>
        <p>=(a<sup>2</sup>+b<sup>2</sup>)<sup>2</sup>-2a<sup>2</sup>b<sup>2</sup></p>
      <br>
        <p>=(a<sup>2</sup>+&radic;2ab+b<sup>2</sup>)(a<sup>2</sup>-&radic;2ab+b<sup>2</sup>)</p>
     </section>

     <section>
       <h3>PROVE</h3>
        <p>(a<sup>2</sup>+b<sup>2</sup>)<sup>2</sup>-2a<sup>2</sup>b<sup>2</sup></p>
      <br>
        <p>=a<sup>4</sup>+2a<sup>2</sup>b<sup>2</sup>+b<sup>4</sup>-2a<sup>2</sup>b<sup>2</sup></p>
      <br>
        <p>=a<sup>4</sup>+b<sup>4</sup></p>
      <br>
        <p>Further, a<sup>4</sup>+b<sup>4</sup>=(a<sup>2</sup>+b<sup>2</sup>)<sup>2</sup>-(&radic;2ab)<sup>2</sup></p>
      <br>
        <p>=(a<sup>2</sup>+b<sup>2</sup>+&radic;2ab)(a<sup>2</sup>+b<sup>2</sup>-&radic;2ab)  (using x<sup>2</sup>-y<sup>2</sup>=(x+y)(x-y))</p>
      <br>
        <p>PROVED</p>
     </section>

  </main>
